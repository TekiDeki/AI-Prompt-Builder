<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Prompt Builder v22.0 - The Luminance Master</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f1f5f9;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --input-bg: #334155;
            --border-color: #475569;
            --highlight: #f472b6;
            --negative-color: #fb7185;
            --ai-color: #a855f7;
            --engine-color: #fbbf24;
            --export-color: #ec4899;
            --donate-color: #ffbb00;
            --engine-mj: #38bdf8;
            --engine-flux: #fbbf24;
            --engine-sd: #10b981;
            --engine-dalle: #a855f7;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            width: 100%;
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            border: 1px solid var(--border-color);
        }

        h1 {
            text-align: center;
            color: var(--accent-color);
            margin-bottom: 10px;
            font-size: 2.8rem;
            letter-spacing: -1px;
        }

        p.subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
            font-size: 1.2rem;
        }

        .ai-analysis-panel {
            background-color: #020617;
            padding: 25px;
            border-radius: 20px;
            border: 2px solid var(--ai-color);
            margin-bottom: 30px;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.2);
        }

        .ai-panel-header {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--ai-color);
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        .ai-input-group {
            display: flex;
            gap: 15px;
        }

        .ai-input-group input {
            flex: 1;
            background-color: var(--input-bg);
            color: white;
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 12px;
            font-size: 1.1rem;
            outline: none;
        }

        .btn-analyze {
            background-color: var(--ai-color);
            color: white;
            padding: 10px 25px;
            border-radius: 12px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-analyze:hover {
            background-color: #9333ea;
            transform: translateY(-2px);
        }

        .engine-panel {
            background-color: #020617;
            padding: 25px;
            border-radius: 20px;
            border: 2px solid var(--engine-color);
            margin-bottom: 30px;
        }

        .engine-main-row {
            display: flex;
            gap: 20px;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        .engine-params-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .engine-label {
            color: var(--engine-color);
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 10px;
            display: block;
        }

        .grid-settings {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 600;
            font-size: 0.9rem;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        select, input {
            background-color: var(--input-bg);
            color: white;
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .file-upload-container {
            background-color: #020617;
            padding: 15px;
            border-radius: 12px;
            border: 1px dashed var(--accent-color);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .upload-label {
            color: var(--accent-color); 
            font-size: 1.1rem; 
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: color 0.3s;
        }

        .aspect-ratio-container {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .aspect-ratio-container input {
            width: 100px;
            text-align: center;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        button {
            padding: 15px 30px;
            border-radius: 12px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 1.1rem;
        }

        .btn-generate {
            background-color: var(--accent-color);
            color: var(--bg-color);
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
        }

        .btn-next, .btn-prev {
            background-color: #10b981;
            color: white;
        }

        .btn-random {
            background-color: #64748b;
            color: white;
        }

        .btn-export {
            background-color: var(--export-color);
            color: white;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
        }

        .result-area {
            background-color: #020617;
            padding: 20px;
            border-radius: 12px;
            border: 1px dashed var(--accent-color);
        }

        .result-label {
            font-size: 0.8rem;
            color: var(--accent-color);
            margin-bottom: 5px;
            text-transform: uppercase;
            font-weight: bold;
        }

        #finalPrompt, #negativePrompt {
            width: 100%;
            background: transparent;
            border: none;
            color: #e2e8f0;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 1.1rem;
            resize: none;
            outline: none;
            line-height: 1.5;
        }

        #negativePrompt {
            color: var(--negative-color);
            border-top: 1px solid #334155;
            padding-top: 10px;
            margin-top: 10px;
        }

        .copy-btn {
            background: var(--accent-color);
            color: var(--bg-color);
            font-size: 0.8rem;
            padding: 5px 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }

        optgroup {
            color: var(--accent-color);
            font-style: normal;
            font-weight: bold;
            background: var(--input-bg);
        }

        .support-footer {
            margin-top: 50px;
            text-align: center;
            padding: 40px;
            border-top: 1px solid var(--border-color);
            background: linear-gradient(to bottom, transparent, rgba(56, 189, 248, 0.05));
            border-radius: 0 0 24px 24px;
        }

        .support-text {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--text-color);
            margin-bottom: 20px;
            display: block;
        }

        .btn-donate {
            background-color: var(--donate-color);
            color: #000;
            padding: 12px 30px;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(255, 187, 0, 0.3);
            text-decoration: none;
            display: inline-block;
            border-radius: 12px;
            font-weight: 800;
            transition: all 0.3s ease;
        }

        .btn-donate:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 187, 0, 0.5);
            background-color: #ffd700;
        }

        /* ===== ENGINE BADGE ===== */
        .engine-badge {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 20px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(56,189,248,0.08), rgba(56,189,248,0.02));
            border: 2px solid var(--accent-color);
            height: fit-content;
            align-self: flex-end;
            margin-bottom: 8px;
            min-width: 240px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            animation: badgeFadeIn 0.5s ease;
            position: relative;
            overflow: hidden;
        }

        .engine-badge::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
            transition: left 0.6s ease;
        }

        .engine-badge:hover::before {
            left: 100%;
        }

        @keyframes badgeFadeIn {
            from { opacity: 0; transform: translateX(15px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .engine-badge-icon {
            font-size: 2rem;
            line-height: 1;
            filter: drop-shadow(0 0 8px currentColor);
        }

        .engine-badge-content {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .engine-badge-title {
            font-size: 1rem;
            font-weight: 800;
            color: var(--text-color);
            letter-spacing: 0.3px;
        }

        .engine-badge-chips {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .chip {
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 6px;
            background: rgba(255,255,255,0.08);
            color: #cbd5e1;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .engine-badge.theme-midjourney { border-color: #38bdf8; }
        .engine-badge.theme-midjourney .engine-badge-icon { color: #38bdf8; }
        .engine-badge.theme-midjourney .chip { background: rgba(56,189,248,0.15); color: #7dd3fc; }

        .engine-badge.theme-flux { border-color: #fbbf24; }
        .engine-badge.theme-flux .engine-badge-icon { color: #fbbf24; }
        .engine-badge.theme-flux .chip { background: rgba(251,191,36,0.15); color: #fcd34d; }

        .engine-badge.theme-stable_diffusion { border-color: #10b981; }
        .engine-badge.theme-stable_diffusion .engine-badge-icon { color: #10b981; }
        .engine-badge.theme-stable_diffusion .chip { background: rgba(16,185,129,0.15); color: #6ee7b7; }

        .engine-badge.theme-dalle3 { border-color: #a855f7; }
        .engine-badge.theme-dalle3 .engine-badge-icon { color: #a855f7; }
        .engine-badge.theme-dalle3 .chip { background: rgba(168,85,247,0.15); color: #c084fc; }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: var(--text-color);
            padding: 14px 24px;
            border-radius: 12px;
            border: 2px solid var(--accent-color);
            font-weight: 600;
            font-size: 1rem;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5), 0 0 20px rgba(56,189,248,0.3);
            opacity: 0;
            z-index: 9999;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast.error {
            border-color: var(--negative-color);
            box-shadow: 0 8px 30px rgba(0,0,0,0.5), 0 0 20px rgba(251,113,133,0.3);
        }

        .btn-reset {
            background-color: transparent;
            color: #94a3b8;
            border: 2px solid var(--border-color);
            font-size: 0.9rem;
            padding: 10px 20px;
        }

        .btn-reset:hover {
            color: var(--negative-color);
            border-color: var(--negative-color);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .engine-badge {
                min-width: auto;
                width: 100%;
                align-self: stretch;
                margin-bottom: 0;
            }
            
            .engine-main-row {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🧠 AI Prompt Builder v22.0</h1>
    <p class="subtitle">The Luminance Master: Physical-Based Lighting & Optic Control</p>

    <div class="ai-analysis-panel">
        <div class="ai-panel-header">✨ AI Prompt Analysis & Optimization</div>
        <div class="ai-input-group">
            <input type="text" id="aiInput" placeholder="Describe your vision... (ex: A portrait, mysterious side lighting, moody)">
            <button class="btn-analyze" onclick="analyzePrompt()">Analyze & Optimize</button>
        </div>
    </div>

    <div class="engine-panel">
        <div class="engine-main-row">
            <div class="setting-group" style="flex: 1;">
                <label class="engine-label">🎯 Target AI Engine</label>
                <select id="targetEngine" onchange="updateEnginePanel()">
                    <optgroup label="Popular">
                        <option value="midjourney">Midjourney v6</option>
                        <option value="flux">FLUX.1 (Pro/Dev/Schnell)</option>
                        <option value="stable_diffusion">Stable Diffusion (SDXL/SD3.5)</option>
                        <option value="dalle3">DALL-E 3</option>
                    </optgroup>
                </select>
            </div>
            <div id="engineBadge" class="engine-badge theme-midjourney">
                <div class="engine-badge-icon" id="engineBadgeIcon">🎨</div>
                <div class="engine-badge-content">
                    <div class="engine-badge-title" id="engineBadgeTitle">Midjourney</div>
                    <div class="engine-badge-chips" id="engineBadgeChips">
                        <span class="chip">Parametric</span>
                        <span class="chip">Discord</span>
                    </div>
                </div>
            </div>
        </div>
        <div id="engineParams" class="engine-params-grid">
            <!-- Dynamic Params injected here -->
        </div>
    </div>

    <div class="file-upload-container">
        <div style="display: flex; align-items: center; gap: 15px;">
            <label for="fileInput" class="upload-label">📁 Upload Subject List (.txt)</label>
            <input type="file" id="fileInput" accept=".txt" style="display: none;">
        </div>
        <div id="queueStatus" style="font-size: 0.9rem; color: #94a3b8;">Queue: 0 / 0 Subjects</div>
    </div>

    <div class="grid-settings">
        <div class="setting-group">
            <label>🔍 Current Subject</label>
            <input type="text" id="subject" placeholder="Enter a subject...">
        </div>

        <div class="setting-group">
            <label>🎭 Visual Style</label>
            <select id="style" onchange="updateLogic()">
                <optgroup label="Photorealism & Cinematic">
                    <option value="Photorealistic" data-tag="real">Photorealism</option>
                    <option value="Hyper-realistic" data-tag="real">Hyper-realism</option>
                    <option value="Cinematic (Hollywood)" data-tag="real">Cinematic</option>
                    <option value="Street Photography" data-tag="real">Street Photography</option>
                    <option value="Editorial Fashion Photography" data-tag="real">Editorial/Fashion</option>
                    <option value="National Geographic style" data-tag="real">National Geographic</option>
                </optgroup>
                <optgroup label="Cinematic Archetypes">
                    <option value="staged in the whimsical, symmetrical style of Wes Anderson" data-tag="cinematic">Wes Anderson Style</option>
                    <option value="Blade Runner 2049 cinematic noir, rainy neon atmosphere" data-tag="cinematic">Blade Runner Noir</option>
                    <option value="Studio Ghibli anime aesthetic, lush landscapes, magical lighting" data-tag="anime">Studio Ghibli</option>
                    <option value="Tim Burton gothic aesthetic, pale tones, distorted forms" data-tag="cinematic">Tim Burton Style</option>
                </optgroup>
                <optgroup label="Fine Art & History">
                    <option value="High Renaissance oil painting, balanced composition, divine light" data-tag="art">Renaissance</option>
                    <option value="Dramatic Baroque painting, deep chiaroscuro, intense emotion" data-tag="art">Baroque</option>
                    <option value="Claude Monet Impressionism, visible brushstrokes, light play" data-tag="art">Impressionism</option>
                    <option value="Art Nouveau decorative style, organic lines, floral patterns" data-tag="art">Art Nouveau</option>
                    <option value="Traditional Japanese Ukiyo-e woodblock print" data-tag="art">Ukiyo-e</option>
                </optgroup>
                <optgroup label="Modern Digital & New Media">
                    <option value="Unreal Engine 5 render, Octane Render" data-tag="digital">UE5 / Octane Render</option>
                    <option value="Cyberpunk aesthetic, neon-infused, high tech" data-tag="digital">Cyberpunk</option>
                    <option value="Vaporwave aesthetic, pastel neon, 80s nostalgia" data-tag="digital">Vaporwave</option>
                    <option value="Dreamcore / Weirdcore surrealism, liminal space" data-tag="digital">Dreamcore</option>
                    <option value="Low Poly digital art, geometric minimalism" data-tag="digital">Low Poly</option>
                    <option value="Professional Claymation / Stop-motion style" data-tag="digital">Claymation</option>
                    <option value="Glitch Art, digital distortion, scanlines" data-tag="digital">Glitch Art</option>
                </optgroup>
                <optgroup label="Tactile Mediums">
                    <option value="Professional Charcoal and Graphite sketch on textured paper" data-tag="sketch">Charcoal / Graphite</option>
                    <option value="Double Exposure photography, surreal blended images" data-tag="real">Double Exposure</option>
                    <option value="Intricate Origami and Papercraft art, paper folds" data-tag="digital">Origami / Papercraft</option>
                    <option value="Stained Glass mosaic, vibrant translucent colors" data-tag="art">Stained Glass</option>
                </optgroup>
                <optgroup label="Graphic & Illustration">
                    <option value="Flat Design minimalist" data-tag="graphic">Flat Design</option>
                    <option value="Professional Vector Art" data-tag="graphic">Vector Art</option>
                    <option value="Studio Ghibli Anime style" data-tag="anime">Anime (Ghibli)</option>
                </optgroup>
            </select>
        </div>

        <div class="setting-group" id="group-composition">
            <label>📐 Composition & Direction</label>
            <select id="composition" onchange="updateLogic()">
                <optgroup label="Shot Sizes">
                    <option value="Extreme wide shot, expansive scene" data-tag="wide">Extreme Wide</option>
                    <option value="Full shot, showing entire subject">Full Shot</option>
                    <option value="Medium shot, waist-up" data-tag="med">Medium Shot</option>
                    <option value="Close-up portrait" data-tag="close">Close-up</option>
                    <option value="Extreme close-up, macro focus" data-tag="macro">Extreme Close-up</option>
                </optgroup>
                <optgroup label="Perspective & POV">
                    <option value="First-person POV, immersive point of view">First-Person POV</option>
                    <option value="Over-the-shoulder shot, OTS perspective" data-tag="ots">Over-the-Shoulder</option>
                    <option value="Third-person observational shot, distant witness" data-tag="obs">Observational</option>
                    <option value="Eye-level shot" data-tag="neutral">Eye-level</option>
                    <option value="Low angle shot, imposing scale" data-tag="low">Low Angle</option>
                    <option value="High angle shot, wide perspective" data-tag="high">High Angle</option>
                    <option value="Dutch angle, tilted frame" data-tag="tilt">Dutch Angle</option>
                    <option value="God's eye view, top-down" data-tag="top">God's Eye</option>
                </optgroup>
                <optgroup label="Framing & Depth">
                    <option value="Layered composition, foreground elements framing the subject">Layered / Framed</option>
                    <option value="Leading lines composition, guiding the eye to the subject">Leading Lines</option>
                    <option value="Symmetrical composition, centered" data-tag="sym">Symmetry</option>
                    <option value="Rule of thirds composition" data-tag="third">Rule of Thirds</option>
                    <option value="Tight framing, claustrophobic composition" data-tag="tight">Tight Framing</option>
                    <option value="Negative space composition" data-tag="empty">Negative Space</option>
                </optgroup>
                <optgroup label="Psychological/Dynamic">
                    <option value="Dynamic diagonal composition, energy and movement">Dynamic Diagonal</option>
                    <option value="Centrifugal composition, expanding from center">Centrifugal</option>
                    <option value="Centripetal composition, converging to center">Centripetal</option>
                </optgroup>
            </select>
        </div>

        <!-- LIGHTING MASTER SUITE -->
        <div class="setting-group">
            <label>💡 Primary Light Source</label>
            <select id="lighting" onchange="updateLogic()">
                <optgroup label="Natural Light">
                    <option value="Golden hour natural sunlight">Golden Hour</option>
                    <option value="Blue hour ethereal lighting">Blue Hour</option>
                    <option value="High noon harsh sunlight" data-tag="noon">High Noon</option>
                </optgroup>
                <optgroup label="Studio & Cinematic">
                    <option value="Professional softbox studio lighting">Studio Softbox</option>
                    <option value="Cinematic rim lighting, backlit silhouette">Rim Lighting</option>
                    <option value="Dramatic chiaroscuro, extreme contrast">Chiaroscuro</option>
                    <option value="Volumetric god rays, atmospheric haze">Volumetric God Rays</option>
                    <option value="Cyberpunk neon lighting, magenta and cyan">Neon Cyberpunk</option>
                </optgroup>
            </select>
        </div>

        <div class="setting-group">
            <label>📐 Light Direction (Angle)</label>
            <select id="lightDirection" onchange="updateLogic()">
                <option value="">Auto / Natural</option>
                <option value="front lighting, flat lighting, clear visibility">Front Lighting</option>
                <option value="side lighting, split lighting, deep facial shadows">Side Lighting (Split)</option>
                <option value="backlighting, rim light, halo effect around subject">Backlighting (Rim)</option>
                <option value="top lighting, butterfly lighting, overhead source">Top Lighting (Overhead)</option>
            </select>
        </div>

        <div class="setting-group">
            <label>✨ Light Quality (Texture)</label>
            <select id="lightQuality" onchange="updateLogic()">
                <option value="">Auto / Balanced</option>
                <option value="hard light, sharp shadows, high contrast">Hard Light (Sharp)</option>
                <option value="soft light, diffused shadows, smooth gradients">Soft Light (Diffused)</option>
                <option value="dappled light, filtered sunlight through leaves">Dappled Light (Patterned)</option>
            </select>
        </div>

        <div class="setting-group">
            <label>🌡️ Color Temperature</label>
            <select id="lightTemp" onchange="updateLogic()">
                <option value="">Auto / Balanced</option>
                <option value="warm color temperature, amber hues, cozy atmosphere">Warm (Amber/Golden)</option>
                <option value="cool color temperature, blue hues, clinical atmosphere">Cool (Blue/Sterile)</option>
                <option value="mixed lighting, contrast between warm and cool tones">Bicolor (Mixed)</option>
            </select>
        </div>

        <div class="setting-group">
            <label>📷 Focal Length (Lens)</label>
            <select id="camera" onchange="updateLogic()">
                <optgroup label="Wide Angle">
                    <option value="Shot on 14mm ultra-wide lens">14mm (Ultra Wide)</option>
                    <option value="Shot on 24mm wide angle lens">24mm (Arch)</option>
                    <option value="Shot on 35mm lens">35mm (Storyteller)</option>
                </optgroup>
                <optgroup label="Standard & Tele">
                    <option value="Shot on 50mm prime lens">50mm (Standard)</option>
                    <option value="Shot on 85mm lens">85mm (Portrait)</option>
                    <option value="Shot on 200mm telephoto lens">200mm (Telephoto)</option>
                </optgroup>

        // Engine principal
        'targetEngine',

        'mjVersion', 'mjStylize', 'mjChaos', 'mjWeird', 'mjStyleRaw', 'mjTile',

    function saveSettings() {
        try {
            const data = {};
            PERSISTED_FIELDS.forEach(id => {
                const el = document.getElementById(id);
                if (!el) return;
                if (el.type === 'checkbox') {
                    data[id] = { type: 'checkbox', value: el.checked };
                } else {
                    data[id] = { type: 'value', value: el.value };
                }
            });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        } catch (e) {
            console.warn('Failed to save settings:', e);
        }
    }

    function loadSettings(filter = null) {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return false;
            const data = JSON.parse(raw);
            let loaded = 0;

            Object.entries(data).forEach(([id, entry]) => {
                if (filter && !filter.includes(id)) return;
                const el = document.getElementById(id);
                if (!el) return;

                if (entry.type === 'checkbox') {
                    el.checked = !!entry.value;
                    loaded++;
                } else {
                    if (el.tagName === 'SELECT') {
                        const optionExists = Array.from(el.options).some(o => o.value === entry.value);
                        if (optionExists) {
                            el.value = entry.value;
                            loaded++;
                        }
                    } else {
                        el.value = entry.value;
                        loaded++;
                    }
                }
            });
            return loaded > 0;
        } catch (e) {
            console.warn('Failed to load settings:', e);
            return false;
        }
    }

    function clearSettings() {
        try {
            localStorage.removeItem(STORAGE_KEY);
            return true;
        } catch (e) {
            console.warn('Failed to clear settings:', e);
            return false;
        }
    }

    function scheduleSave() {
        if (saveTimeout) clearTimeout(saveTimeout);
        saveTimeout = setTimeout(saveSettings, 400);
    }

    function attachAutoSaveListeners() {
        PERSISTED_FIELDS.forEach(id => {
            const el = document.getElementById(id);
            if (!el) return;
            const eventType = (el.tagName === 'SELECT' || el.type === 'checkbox') ? 'change' : 'input';
            el.addEventListener(eventType, scheduleSave);
        });

        // Event delegation pentru input-urile dinamice din #engineParams
        const engineParams = document.getElementById('engineParams');
        if (engineParams) {
            engineParams.addEventListener('change', scheduleSave);
            engineParams.addEventListener('input', scheduleSave);
        }
    }

        saveSettings();
        showToast('💾 Setările au fost salvate');

        });

        badge.title = cfg.tooltip;

        badge.style.animation = 'none';
        void badge.offsetWidth;
        badge.style.animation = 'badgeFadeIn 0.5s ease';
    }

    function refreshBadgeVersion(engine) {
        const cfg = ENGINE_BADGES[engine];
        if (!cfg) return;

        let versionLabel = '';
        if (engine === 'midjourney') {
            const v = document.getElementById('mjVersion')?.value;
            if (v) versionLabel = v.startsWith('niji') ? 'Niji 6' : 'v' + v;
        } else if (engine === 'stable_diffusion') {
            versionLabel = document.getElementById('sdVersion')?.value || '';
        } else if (engine === 'flux') {
            const v = document.getElementById('fluxVariant')?.value || '';
            versionLabel = v.replace('FLUX.1 ', '');
        } else if (engine === 'dalle3') {
            versionLabel = document.getElementById('dalleVersion')?.value || '';
        }

        const titleEl = document.getElementById('engineBadgeTitle');
        titleEl.textContent = versionLabel ? `${cfg.title} · ${versionLabel}` : cfg.title;
    }

    // ============================================================
    // ENGINE PANEL RENDERING (Pașii 2, 3, 4)
    // ============================================================
    function updateEnginePanel() {
        const engine = document.getElementById('targetEngine').value;
        const panel = document.getElementById('engineParams');
        panel.innerHTML = '';

        updateEngineBadge(engine);

        const config = ENGINE_CONFIGS[engine];
        config.params.forEach(p => {
            const group = document.createElement('div');
            group.className = 'setting-group';

            const label = document.createElement('label');
            label.innerText = p.label;
            group.appendChild(label);

            let input;
            if (p.type === 'select') {
                input = document.createElement('select');
                if (Array.isArray(p.options)) {
                    p.options.forEach(optGroup => {
                        const og = document.createElement('optgroup');
                        og.label = optGroup.group;
                        optGroup.vals.forEach(val => {
                            const o = document.createElement('option');
                            o.value = val; o.innerText = val;
                            og.appendChild(o);
                        });
                        input.appendChild(og);
                    });
                } else {
                    p.options.forEach(val => {
                        const o = document.createElement('option');
                        o.value = val; o.innerText = val;
                        input.appendChild(o);
                    });
                }
            } else if (p.type === 'checkbox') {
                const cbWrapper = document.createElement('label');
                cbWrapper.style.cssText = 'display:flex; align-items:center; gap:10px; background:var(--input-bg); border:1px solid var(--border-color); padding:12px; border-radius:12px; cursor:pointer; font-weight:normal; color:white; font-size:1rem;';

                input = document.createElement('input');
                input.type = 'checkbox';
                input.checked = !!p.default;
                input.style.cssText = 'width:20px; height:20px; accent-color:var(--accent-color); cursor:pointer; margin:0;';

                const cbLabel = document.createElement('span');
                cbLabel.innerText = p.checkboxLabel || 'Enable';

                cbWrapper.appendChild(input);
                cbWrapper.appendChild(cbLabel);

                input.id = p.id;
                group.appendChild(cbWrapper);
                panel.appendChild(group);
                return;
            } else {
                input = document.createElement('input');
                input.type = p.type;
                input.value = p.default;
                if (p.min !== undefined) input.min = p.min;
                if (p.max !== undefined) input.max = p.max;
                if (p.step !== undefined) input.step = p.step;
            }
            input.id = p.id;
            group.appendChild(input);
            panel.appendChild(group);
        });

        // Listener-i pe select-uri de versiune pentru re-badge
        const versionSelectIds = ['mjVersion', 'sdVersion', 'fluxVariant', 'dalleVersion'];
        versionSelectIds.forEach(id => {
            const el = document.getElementById(id);
            if (el) {
                el.addEventListener('change', () => refreshBadgeVersion(engine));
            }
        });

        refreshBadgeVersion(engine);
    }

    // ============================================================
    // FILE UPLOAD
    // ============================================================
    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(event) {
            const text = event.target.result;
            subjectQueue = text.split(/\r?\n/).map(line => line.trim()).filter(line => line !== "");
            if (subjectQueue.length > 0) {
                currentQueueIndex = 0;
                document.getElementById('subject').value = subjectQueue[0];
                updateQueueStatus();
                smartRandomize(subjectQueue[0]);
            }
        };
        reader.readAsText(file);
    });

    function updateQueueStatus() {
        document.getElementById('queueStatus').innerText = `Queue: ${subjectQueue.length > 0 ? currentQueueIndex + 1 : 0} / ${subjectQueue.length} Subjects`;
    }

    function handleRatioChange() {
        const preset = document.getElementById('ratioPreset').value;
        const customInput = document.getElementById('customRatio');
        customInput.disabled = (preset !== 'custom');
        if (preset === 'custom') customInput.focus();
    }

    // ============================================================
    // LOGIC (conflict detection)
    // ============================================================
    function updateLogic() {
        const style = document.getElementById('style').selectedOptions[0]?.dataset.tag;
        const composition = document.getElementById('composition').selectedOptions[0]?.dataset.tag;
        const camera = document.getElementById('camera').selectedOptions[0]?.dataset.tag;
        const lightingSource = document.getElementById('lighting').selectedOptions[0]?.dataset.tag;

        // 1. PHYSICS LOCK: High Noon forces Hard Light and Top Lighting
        if (lightingSource === 'noon') {
            document.getElementById('lightQuality').value = "hard light, sharp shadows, high contrast";
            document.getElementById('lightDirection').value = "top lighting, butterfly lighting, overhead source";
        }

        // 2. Camera vs Composition
        if (camera === 'macro') {
            hideOptionsByTag('composition', 'wide');
            hideOptionsByTag('composition', 'obs');
        } else {
            showAllOptions('composition');
        }

        // 3. Style vs Quality
        if (style === 'digital') hideOptionsByTag('qualityStandard', 'real'); 
        else showAllOptions('qualityStandard');

        // 4. Composition conflict logic
        if (composition === 'sym') hideOptionsByTag('composition', 'tilt');
        if (composition === 'tight') hideOptionsByTag('composition', 'wide');

        // 5. Niji version → anime styles only
        const mjVersionSelect = document.getElementById('mjVersion');
        if (mjVersionSelect && mjVersionSelect.value.startsWith('niji')) {
            const styleVal = document.getElementById('style').value;
            if (!styleVal.toLowerCase().includes('ghibli') && !styleVal.toLowerCase().includes('anime')) {
                document.getElementById('style').value = "Studio Ghibli anime aesthetic, lush landscapes, magical lighting";
            }
        }
    }

    function hideOptionsByTag(selectId, tagToHide) {
        const select = document.getElementById(selectId);
        if (!select) return;
        Array.from(select.options).forEach(option => {
            if (option.dataset.tag === tagToHide) {
                option.style.display = 'none';
            }
        });
    }

    function showAllOptions(selectId) {
        const select = document.getElementById(selectId);
        if (!select) return;
        Array.from(select.options).forEach(option => option.style.display = 'block');
    }

    // ============================================================
    // AI ANALYSIS
    // ============================================================
    function analyzePrompt() {
        const input = document.getElementById('aiInput').value.toLowerCase();
        if (!input) {
            alert("Please enter a vision description first!");
            return;
        }

        const subjectMatch = input.match(/^(.*?)(?=\s(in a|with|on|at|during|by|background)\b)/i);
        const extractedSubject = subjectMatch ? subjectMatch[1] : input;
        document.getElementById('subject').value = extractedSubject;

        const styleSelect = document.getElementById('style');
        const compSelect = document.getElementById('composition');
        const lightSelect = document.getElementById('lighting');
        const camSelect = document.getElementById('camera');
        const renderSelect = document.getElementById('renderTech');
        const apertureSelect = document.getElementById('aperture');
        const motionSelect = document.getElementById('motion');
        const interactionSelect = document.getElementById('interaction');
        const dirSelect = document.getElementById('lightDirection');
        const qualSelect = document.getElementById('lightQuality');

        for (let key in SEMANTIC_MAP.styles) { if (input.includes(key)) { styleSelect.value = SEMANTIC_MAP.styles[key]; break; } }
        for (let key in SEMANTIC_MAP.compositions) { if (input.includes(key)) { compSelect.value = SEMANTIC_MAP.compositions[key]; break; } }
        for (let key in SEMANTIC_MAP.lighting) { if (input.includes(key)) { lightSelect.value = SEMANTIC_MAP.lighting[key]; break; } }
        for (let key in SEMANTIC_MAP.cameras) { if (input.includes(key)) { camSelect.value = SEMANTIC_MAP.cameras[key]; break; } }
        for (let key in SEMANTIC_MAP.render) { if (input.includes(key)) { renderSelect.value = SEMANTIC_MAP.render[key]; break; } }

        if (input.includes("bokeh") || input.includes("blurred background")) apertureSelect.value = "shot at f/1.2, ultra-shallow depth of field, creamy bokeh";
        if (input.includes("sharp") || input.includes("clear background")) apertureSelect.value = "shot at f/8, sharp detail across the frame, deep focus";
        if (input.includes("waterfall") || input.includes("long exposure")) motionSelect.value = "long exposure, motion blur, silky textures";
        if (input.includes("frozen") || input.includes("action")) motionSelect.value = "high speed shutter, frozen action, zero motion blur";
        if (input.includes("dusty") || input.includes("sunbeam")) interactionSelect.value = "floating dust motes in sunbeams, airborne micro-particles";
        if (input.includes("rainy") || input.includes("wet")) interactionSelect.value = "rain-splashed surfaces, water droplets bouncing off subject";
        if (input.includes("windy") || input.includes("movement")) interactionSelect.value = "wind-blown textures, fabric fluttering, hair movement";

        if (input.includes("moody") || input.includes("mysterious") || input.includes("dramatic")) {
            dirSelect.value = "side lighting, split lighting, deep facial shadows";
            qualSelect.value = "hard light, sharp shadows, high contrast";
        }
        if (input.includes("soft") || input.includes("ethereal")) {
            qualSelect.value = "soft light, diffused shadows, smooth gradients";
        }

        updateLogic();
        generatePrompt();
    }

    // ============================================================
    // SMART RANDOMIZE
    // ============================================================
    function smartRandomize(subjectText) {
        const subLow = (subjectText || document.getElementById('subject').value).toLowerCase();
        const styleSelect = document.getElementById('style');

        if (subLow.includes("cyberpunk") || subLow.includes("futuristic")) styleSelect.value = "Cyberpunk aesthetic";
        else if (subLow.includes("portrait") || subLow.includes("woman") || subLow.includes("man")) styleSelect.value = "Hyper-realistic";
        else styleSelect.selectedIndex = Math.floor(Math.random() * styleSelect.options.length);

        const compSelect = document.getElementById('composition');
        if (subLow.includes("city") || subLow.includes("landscape")) {
            compSelect.value = "Extreme wide shot, expansive scene";
        } else if (subLow.includes("watch") || subLow.includes("detail")) {
            compSelect.value = "Extreme close-up, macro focus";
        } else {
            const options = Array.from(compSelect.options).filter(o => o.dataset.tag !== 'wide');
            compSelect.value = options[Math.floor(Math.random() * options.length)].value;
        }

        const camSelect = document.getElementById('camera');
        if (compSelect.value.includes("macro")) camSelect.value = "Macro lens, extreme close-up";
        else if (compSelect.value.includes("wide")) camSelect.value = "Shot on 14mm ultra-wide lens";
        else camSelect.selectedIndex = Math.floor(Math.random() * camSelect.options.length);

        const bgSelect = document.getElementById('background');
        const bgVal = bgSelect.value.toLowerCase();
        const intSelect = document.getElementById('interaction');

        if (bgVal.includes("rainy")) intSelect.value = "rain-splashed surfaces, water droplets bouncing off subject";
        else if (bgVal.includes("jungle") || bgVal.includes("glade")) intSelect.value = "floating pollen and iridescent spores, ethereal particles";
        else if (bgVal.includes("volcanic") || bgVal.includes("wasteland")) intSelect.value = "floating embers and ash, scorched air, volcanic particles";
        else if (bgVal.includes("industrial") || bgVal.includes("decay")) intSelect.value = "floating dust motes in sunbeams, airborne micro-particles";
        else intSelect.selectedIndex = Math.floor(Math.random() * intSelect.options.length);

        const others = ['lighting', 'lightDirection', 'lightQuality', 'lightTemp', 'aperture', 'motion', 'filmStock', 'qualityStandard', 'colorPalette', 'renderTech', 'background'];
        others.forEach(id => {
            const sel = document.getElementById(id);
            sel.selectedIndex = Math.floor(Math.random() * sel.options.length);
        });

        updateLogic();
        generatePrompt();
    }

    // ============================================================
    // QUEUE NAVIGATION
    // ============================================================
    function nextSubject() {
        if (subjectQueue.length === 0) { alert("Please upload a .txt file first!"); return; }
        if (currentQueueIndex < subjectQueue.length - 1) {
            currentQueueIndex++;
            const nextSub = subjectQueue[currentQueueIndex];
            document.getElementById('subject').value = nextSub;
            smartRandomize(nextSub);
            updateQueueStatus();
        } else { alert("Reached the end of the list!"); }
    }

    function prevSubject() {
        if (subjectQueue.length === 0) { alert("Please upload a .txt file first!"); return; }
        if (currentQueueIndex > 0) {
            currentQueueIndex--;
            const prevSub = subjectQueue[currentQueueIndex];
            document.getElementById('subject').value = prevSub;
            smartRandomize(prevSub);
            updateQueueStatus();
        } else { alert("You are at the first subject!"); }
    }

    // ============================================================
    // BUILD PROMPT (Pașii 2, 3, 4)
    // ============================================================
    function buildPromptString(subjectText) {
        const engine = document.getElementById('targetEngine').value;
        const style = document.getElementById('style').value;
        const composition = document.getElementById('composition').value;
        const lightingSrc = document.getElementById('lighting').value;
        const lDir = document.getElementById('lightDirection').value;
        const lQual = document.getElementById('lightQuality').value;
        const lTemp = document.getElementById('lightTemp').value;
        const camera = document.getElementById('camera').value;
        const aperture = document.getElementById('aperture').value;
        const motion = document.getElementById('motion').value;
        const film = document.getElementById('filmStock').value;
        const interaction = document.getElementById('interaction').value;
        const qualityStd = document.getElementById('qualityStandard').value;
        const colorPalette = document.getElementById('colorPalette').value;
        const renderTech = document.getElementById('renderTech').value;
        const background = document.getElementById('background').value;

        const ratioPreset = document.getElementById('ratioPreset').value;
        const customRatio = document.getElementById('customRatio').value;
        const finalRatio = (ratioPreset === 'custom') ? customRatio : ratioPreset;

        const opticals = [aperture, motion, film].filter(Boolean).join(", ");
        const opticalsString = opticals ? `${opticals}, ` : "";

        const lightStack = [lightingSrc, lDir, lQual, lTemp].filter(Boolean).join(", ");
        const lightString = lightStack ? `${lightStack}, ` : "";

        if (engine === 'midjourney') {
            const version = document.getElementById('mjVersion')?.value || '6.0';
            const stylize = document.getElementById('mjStylize')?.value || 250;
            const chaos = document.getElementById('mjChaos')?.value || 0;
            const weird = document.getElementById('mjWeird')?.value || 0;
            const styleRaw = document.getElementById('mjStyleRaw')?.checked || false;
            const tile = document.getElementById('mjTile')?.checked || false;
            const ratioString = finalRatio ? `--ar ${finalRatio}` : '';

            const isNiji = version.startsWith('niji');
            const versionFlag = isNiji ? `--niji ${version.split(' ')[1]}` : `--v ${version}`;

            const supportsWeird = !version.startsWith('5');
            const weirdFlag = supportsWeird ? ` --weird ${weird}` : '';

            let extraFlags = '';
            if (styleRaw && !isNiji) extraFlags += ' --style raw';
            if (tile) extraFlags += ' --tile';

            return `${composition}, ${style} of ${subjectText}, ${background}, ${interaction}, ${lightString}${camera}, ${opticalsString}${colorPalette}, ${qualityStd}, ${renderTech}. ${ratioString} ${versionFlag} --stylize ${stylize} --chaos ${chaos}${weirdFlag}${extraFlags}`;
        }
        else if (engine === 'flux') {
            const variant = document.getElementById('fluxVariant')?.value || "FLUX.1 [dev]";
            const guidance = document.getElementById('fluxGuidance')?.value || 3.5;
            const steps = document.getElementById('fluxSteps')?.value || 28;
            const seed = document.getElementById('fluxSeed')?.value || 0;
            const refiner = document.getElementById('fluxRefiner')?.checked || false;

            const naturalPrompt =
                `A ${style.toLowerCase()} image of ${subjectText}, composed as a ${composition.toLowerCase()}. ` +
                `The scene is set in ${background.toLowerCase()}, with ${interaction.toLowerCase()}. ` +
                `Lighting: ${lightString.slice(0, -2)}. ` +
                `Captured with ${camera.toLowerCase()}, ${opticalsString.slice(0, -2)}. ` +
                `Color palette: ${colorPalette.toLowerCase()}. ` +
                `Rendered with ${renderTech.toLowerCase()}, quality standard: ${qualityStd.toLowerCase()}.`;

            const seedStr = (seed && seed !== "0") ? `, seed: ${seed}` : '';
            const refinerStr = refiner ? ', refiner: on' : '';
            return `${naturalPrompt} [${variant} | guidance: ${guidance} | steps: ${steps}${seedStr}${refinerStr} | aspect: ${finalRatio}]`;
        }
        else if (engine === 'stable_diffusion') {
            const version = document.getElementById('sdVersion')?.value || "SDXL 1.0";
            const model = document.getElementById('sdModel')?.value || "SDXL";
            const cfg = document.getElementById('sdCfg')?.value || 7;
            const steps = document.getElementById('sdSteps')?.value || 20;
            const sampler = document.getElementById('sdSampler')?.value || "Euler a";
            const hires = document.getElementById('sdHires')?.checked || false;
            const refiner = document.getElementById('sdRefiner')?.checked || false;
            const faceRestore = document.getElementById('sdFaceRestore')?.checked || false;

            let postProcess = [];
            if (hires) postProcess.push('Hires Fix 2x');
            if (refiner) postProcess.push('Refiner');
            if (faceRestore) postProcess.push('Face Restoration');
            const postStr = postProcess.length ? `, Post-Process: ${postProcess.join(' + ')}` : '';

            if (version.startsWith('SD 3')) {
                const sd3Prompt =
                    `A ${style.toLowerCase()} image of ${subjectText}, composed as a ${composition.toLowerCase()}, ` +
                    `set in ${background.toLowerCase()}, with ${interaction.toLowerCase()}. ` +
                    `Lighting: ${lightString.slice(0, -2)}. Captured with ${camera.toLowerCase()}, ${opticalsString.slice(0, -2)}. ` +
                    `Color palette: ${colorPalette.toLowerCase()}. Rendered with ${renderTech.toLowerCase()}. ` +
                    `Quality: ${qualityStd.toLowerCase()}.`;
                return `${sd3Prompt} [${version} | ${model} | CFG ${cfg} | Steps ${steps} | Sampler ${sampler}${postStr}]`;
            }

            const lightningBoost = model.includes("Lightning") ? ':1.2' : '';
            const subjectBoost = model.includes("Lightning") ? ':1.3' : '';
            return `(masterpiece${lightningBoost}), (best quality${lightningBoost}), ${version} ${model} style, (${subjectText}${subjectBoost}), ${composition}, ${style}, ${background}, ${lightString}${camera}, ${opticalsString}${colorPalette}, ${renderTech}, ${interaction}, ${qualityStd}, CFG ${cfg}, Steps ${steps}, Sampler ${sampler}${postStr}`;
        }
        else if (engine === 'dalle3') {
            const dalleVersion = document.getElementById('dalleVersion')?.value || 'DALL-E 3';
            const dalleStyle = document.getElementById('dalleStyle')?.value || 'Vivid';

            const hdBoost = dalleVersion.includes('HD')
                ? ' Render in ultra high detail with crisp textures, sharp text, and refined micro-details.'
                : '';

            return `A professional ${style} image of ${subjectText}. The scene is composed as a ${composition}, set against a ${background}. The lighting is ${lightString}${camera}. ${opticalsString}The image features ${interaction}, with a color mood and palette of ${colorPalette}, using ${renderTech}. The overall quality is ${qualityStd}.${hdBoost} Style: ${dalleStyle}. Aspect ratio: ${finalRatio}.`;
        }
        return "";
    }

    // ============================================================
    // GENERATE PROMPT
    // ============================================================
    function generatePrompt() {
        const subject = document.getElementById('subject').value || "A stunning subject";
        const prompt = buildPromptString(subject);
        document.getElementById('finalPrompt').value = prompt;

        const styleTag = document.getElementById('style').selectedOptions[0]?.dataset.tag;
        let negParts = [NEGATIVE_ENGINE.core];
        const organicKeywords = ['woman', 'man', 'person', 'face', 'girl', 'boy', 'human', 'animal', 'dog', 'cat', 'dragon', 'creature', 'goddess', 'sailor', 'astronaut'];
        if (organicKeywords.some(word => subject.toLowerCase().includes(word))) negParts.push(NEGATIVE_ENGINE.organic);
        if (styleTag && NEGATIVE_ENGINE.conflict[styleTag]) negParts.push(NEGATIVE_ENGINE.conflict[styleTag]);
        negParts.push(NEGATIVE_ENGINE.quality);

        if (document.getElementById('targetEngine').value === 'stable_diffusion') negParts.push("watermark, text, logo, lowpoly, bad proportions, blurry, distorted");

        if (document.getElementById('targetEngine').value === 'midjourney') {
            const currentPrompt = document.getElementById('finalPrompt').value;
            const negString = negParts.join(", ");
            document.getElementById('finalPrompt').value = `${currentPrompt} --no ${negString}`;
        }

        document.getElementById('negativePrompt').value = negParts.join(", ");

        scheduleSave();
    }

    // ============================================================
    // EXPORT SD BATCH
    // ============================================================
    function exportSDBatch() {
        if (subjectQueue.length === 0) {
            alert("No subject list uploaded. Please upload a .txt file first.");
            return;
        }

        if (document.getElementById('targetEngine').value !== 'stable_diffusion') {
            if (!confirm("You are not currently using the Stable Diffusion engine. Exporting will still work, but the prompt format might not be optimal for SD. Continue?")) return;
        }

        let batchContent = "";
        subjectQueue.forEach((subject) => {
            const prompt = buildPromptString(subject);
            const cleanPrompt = prompt.replace(/\r?\n|\r/g, " ").trim();
            batchContent += cleanPrompt + "\n";
        });

        const blob = new Blob([batchContent], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `sd_batch_export_${Date.now()}.txt`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    // ============================================================
    // COPY PROMPT
    // ============================================================
    function copyPrompt(id) {
        const copyText = document.getElementById(id);
        if (!copyText.value) return;
        copyText.select();
        navigator.clipboard.writeText(copyText.value);
        const btn = event.target;
        const originalText = btn.innerText;
        btn.innerText = "Copied! ✅";
        setTimeout(() => btn.innerText = originalText, 2000);
    }

    // ============================================================
    // INITIALIZATION (Pasul 6 — ordine corectă)
    // ============================================================
    window.onload = () => {
        // 1. Restaurează setările (inclusiv targetEngine)
        const hadSaved = loadSettings();

        // 2. Randează panel-ul engine-ului (cu engine-ul restaurat)
        updateEnginePanel();

        // 3. Acum că panel-ul e randat, restaurează parametrii dinamici
        const dynamicFields = PERSISTED_FIELDS.filter(id =>
            id.startsWith('mj') || id.startsWith('sd') || id.startsWith('flux') || id.startsWith('dalle')
        );
        loadSettings(dynamicFields);

        // 4. Re-aplică logica condiționată
        updateLogic();

        // 5. Ratio custom enabled/disabled
        handleRatioChange();

        // 6. Re-randează badge-ul cu versiunea corectă
        const engine = document.getElementById('targetEngine').value;
        refreshBadgeVersion(engine);

        // 7. Notificare restaurare
        if (hadSaved) showToast('✅ Setările au fost restaurate');

        // 8. Auto-save listeners
        attachAutoSaveListeners();

        // 9. Cross-tab sync
        window.addEventListener('storage', (e) => {
            if (e.key === STORAGE_KEY && e.newValue) {
                loadSettings();
                updateLogic();
                const eng = document.getElementById('targetEngine').value;
                refreshBadgeVersion(eng);
                showToast('🔄 Setări sincronizate din alt tab');
            }
        });
    };
